  <path d="M32 3.5 C36.5 3.5 40.5 5.3 44 7.2 L55 12.4 C57 13.5 58.5 15.6 58.5 17.8 V29.5 C58.5 46.9 47.6 58.4 32.5 62.5 C17.4 58.4 6.5 46.9 6.5 29.5 V17.8 C6.5 15.6 8 13.5 10 12.4 L21 7.2 C24.5 5.3 28.5 3.5 32 3.5 Z"
