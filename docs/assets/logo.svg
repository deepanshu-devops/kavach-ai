<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Kavach AI">
  <defs>
    <!-- Light app-tile base (light theme) -->
    <linearGradient id="kbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f2f7fe"/>
      <stop offset="1" stop-color="#e6eefc"/>
    </linearGradient>
    <!-- Soft brand edge -->
    <linearGradient id="kedge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ec6f7"/>
      <stop offset="0.5" stop-color="#b3a3f2"/>
      <stop offset="1" stop-color="#f2aee8"/>
    </linearGradient>
    <!-- Armor shield (Kavach) -->
    <linearGradient id="kshield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9fe0"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <!-- Verified check -->
    <linearGradient id="kcheck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fc98a"/>
      <stop offset="1" stop-color="#3f8f2a"/>
    </linearGradient>
  </defs>

  <!-- App-tile base -->
  <rect x="1.4" y="1.4" width="45.2" height="45.2" rx="13" fill="url(#kbg)"/>
  <rect x="1.4" y="1.4" width="45.2" height="45.2" rx="13" fill="none" stroke="url(#kedge)" stroke-width="1.8"/>

  <!-- Armor shield (Kavach) -->
  <path d="M24 10.5 L34.5 14.6 V25 C34.5 32.1 30.1 37 24 39.5 C17.9 37 13.5 32.1 13.5 25 V14.6 Z"
        fill="none" stroke="url(#kshield)" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M24 15.4 V34.3" stroke="#2f9fe0" stroke-width="0.9" opacity="0.28"/>
  <path d="M18.5 24.9 l3.7 3.7 l7.6 -8.4"
        fill="none" stroke="url(#kcheck)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
